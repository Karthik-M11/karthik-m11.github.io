{% assign posts = include.posts | default: site.posts %}
{% if posts.size > 0 %}
  <ul>
    {% for post in posts %}
      <li class="post-list-item">
        <span class="home-date">
          {{ post.date | date: site.theme_config.date_format }}»
        </span>
        <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
      </li>
    {% endfor %}
  </ul>
{% endif %}
