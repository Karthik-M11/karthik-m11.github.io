title: Hi there, I'm Karthik!
author: Karthik
url: https://example.com
baseurl: ""

description: >
  An experimental website designed by me, to pass time 😁

permalink: /:slug

remote_theme: abhinavs/moonwalk

theme_config:
  appearance: "dark"
  appearance_toggle: true
  date_format: "%Y-%m-%d"

  show_description: true
  show_navbar: true
  show_footer: true
  show_copyright: true

  # Homepage sections
  show_projects: true
  show_blog: true
  show_old_projects: false
  show_misc_list: false

  # Post features
  show_reading_time: true
  show_tags: true
  show_code_copy: true
  show_progress_bar: true
  show_back_to_top: true
  show_post_nav: true
  show_toc: true
  show_footnote_tooltips: true
  show_link_previews: true

  home:
    title_projects: Projects
    title_misc_list: About
    title_blog: Writing
    title_old_projects: Archive

highlighter: rouge

sass:
  style: :compressed

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-soopr-seo-tag
  - jekyll-markdown-output
  - jekyll-llms-output

markdown_output:
  collections:
    - posts

llms_output:
  index:
    collections:
      - posts
  full:
    collections:
      - posts
    respect_markdown_output: true