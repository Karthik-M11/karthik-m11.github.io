key: 3
title: Contact
permalink: /contact/
options: nolanding
excerpt: Get in touch
background-image: caustic_light.jpg
---

<section>
  <form id="sendemail" method="POST" action="https://formspree.io/f/xykbrjpz">

    <div class="row uniform">

      <div class="6u 12u$(xsmall)">
        <input type="text" name="name" id="name" placeholder="Name" />
      </div>

      <div class="6u$ 12u$(xsmall)">
        <input required type="email" name="email" id="email" placeholder="Email" />
      </div>

      <div class="12u$">
        <input required type="text" name="subject" id="subject" placeholder="Subject" />
      </div>

      <div class="12u$">
        <textarea required name="message" id="message" placeholder="Type your message" rows="6"></textarea>
      </div>

      <div class="12u$">
        <ul class="actions">
          <li><input type="submit" value="Send Message" class="special" /></li>
        </ul>
      </div>

    </div>

  </form>
</section>

<script>
  // 🚫 Disable theme/jQuery form interception (CRITICAL FIX)
  $(document).ready(function () {
    $("#sendemail").off("submit");
    $("#sendemail").unbind("submit");
  });
</script>
